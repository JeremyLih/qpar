  - [0, 2]
  - [0, 3]
  6:
  - [0, 1]
  - [0, 3]
  - [1, 2]
  - [1, 5]
  - [2, 3]
  8:
  - [0, 1]
  - [0, 3]
  - [0, 5]
  - [1, 4]
  - [1, 7]
  - [2, 5]
  - [3, 4]
